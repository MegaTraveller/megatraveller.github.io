<!-- AENDERUNG 2026: Hell-/Dunkel-Umschalter als Sonne/Mond-Switch (Optik in
     custom.css). Struktur (input#theme-switch + label) bleibt, damit das Skript
     unten unveraendert weiterfunktioniert. -->
<div class="theme-toggle" title="Hell-/Dunkelmodus umschalten">
    <input type="checkbox" id="theme-switch" />
    <label for="theme-switch" aria-label="Zwischen hellem und dunklem Modus wechseln">
        <span class="tt-track" aria-hidden="true">
            <span class="tt-star tt-star-1"></span>
            <span class="tt-star tt-star-2"></span>
            <span class="tt-star tt-star-3"></span>
            <span class="tt-thumb">
                <svg class="tt-icon tt-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/>
                    <line x1="12" y1="1.6" x2="12" y2="4"/>
                    <line x1="12" y1="20" x2="12" y2="22.4"/>
                    <line x1="1.6" y1="12" x2="4" y2="12"/>
                    <line x1="20" y1="12" x2="22.4" y2="12"/>
                    <line x1="4.6" y1="4.6" x2="6.3" y2="6.3"/>
                    <line x1="17.7" y1="17.7" x2="19.4" y2="19.4"/>
                    <line x1="4.6" y1="19.4" x2="6.3" y2="17.7"/>
                    <line x1="17.7" y1="6.3" x2="19.4" y2="4.6"/>
                </svg>
                <svg class="tt-icon tt-moon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>
                </svg>
            </span>
        </span>
    </label>
</div>

{%- assign name = 'night_mode' -%} {%- include functions.html func='get_value'
default='auto' -%} {%- assign night_mode = return -%}

<script>
    (function () {
        var sw = document.getElementById("theme-switch");
        var html = document.getElementsByTagName("html")[0];
        var nightModeOption = ("{{ night_mode }}" || "auto").toLowerCase();
        var storage =
            nightModeOption === "manual" ? localStorage : sessionStorage;
        var themeData = loadThemeData();

        function saveThemeData(data) {
            storage.setItem("theme", JSON.stringify(data));
        }

        function loadThemeData() {
            var data = storage.getItem("theme");
            try {
                data = JSON.parse(data ? data : "");
            } catch (e) {
                data = { nightShift: undefined, autoToggleAt: 0 };
                saveThemeData(data);
            }
            return data;
        }

        function handleThemeToggle(nightShift) {
            themeData.nightShift = nightShift;
            saveThemeData(themeData);
            html.dataset.theme = nightShift ? "dark" : "light";
            setTimeout(function () {
                sw.checked = nightShift ? true : false;
            }, 50);
        }

        function autoThemeToggle() {
            // Next time point of theme toggle
            var now = new Date();
            var toggleAt = new Date();
            var hours = now.getHours();
            var nightShift = hours >= 19 || hours <= 7;

            if (nightShift) {
                if (hours > 7) {
                    toggleAt.setDate(toggleAt.getDate() + 1);
                }
                toggleAt.setHours(7);
            } else {
                toggleAt.setHours(19);
            }

            toggleAt.setMinutes(0);
            toggleAt.setSeconds(0);
            toggleAt.setMilliseconds(0);

            var delay = toggleAt.getTime() - now.getTime();

            // auto toggle theme mode
            setTimeout(function () {
                handleThemeToggle(!nightShift);
            }, delay);

            return {
                nightShift: nightShift,
                toggleAt: toggleAt.getTime(),
            };
        }

        // AENDERUNG 2026: Betriebssystem-Farbpräferenz erkennen (HIG: System-
        // Dunkelmodus respektieren).
        function osHasPreference() {
            try {
                return !!window.matchMedia && (
                    window.matchMedia("(prefers-color-scheme: dark)").matches ||
                    window.matchMedia("(prefers-color-scheme: light)").matches);
            } catch (e) { return false; }
        }
        function osPrefersDark() {
            try {
                return !!window.matchMedia &&
                    window.matchMedia("(prefers-color-scheme: dark)").matches;
            } catch (e) { return false; }
        }

        // Merkt sich, ob der Nutzer in DIESER Sitzung selbst umgeschaltet hat.
        var manualOverride = false;

        // Listen the theme toggle event
        sw.addEventListener("change", function (event) {
            manualOverride = true;               // Nutzerwahl hat ab jetzt Vorrang
            handleThemeToggle(event.target.checked);
        });

        if (nightModeOption == "auto") {
            // AENDERUNG 2026: Priorität 1) eigene Wahl dieser Sitzung,
            // 2) OS-Dunkelmodus, 3) bisherige Uhrzeit-Automatik.
            if (themeData.nightShift !== undefined) {
                handleThemeToggle(themeData.nightShift);
            } else if (osHasPreference()) {
                handleThemeToggle(osPrefersDark());
            } else {
                var data = autoThemeToggle();
                if (data.toggleAt > themeData.autoToggleAt) {
                    themeData.autoToggleAt = data.toggleAt;
                    handleThemeToggle(data.nightShift);
                } else {
                    handleThemeToggle(themeData.nightShift);
                }
            }
            // Live auf OS-Wechsel reagieren, solange nicht manuell übersteuert.
            try {
                window.matchMedia("(prefers-color-scheme: dark)")
                    .addEventListener("change", function (e) {
                        if (!manualOverride) handleThemeToggle(e.matches);
                    });
            } catch (e) {}
        } else if (nightModeOption == "manual") {
            handleThemeToggle(themeData.nightShift);
        } else {
            var nightShift = themeData.nightShift;
            if (nightShift === undefined) {
                nightShift = nightModeOption === "on";
            }
            handleThemeToggle(nightShift);
        }
    })();
</script>
